<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf8f3" />
    <title>G Confeitaria | Gestão</title>
    <script>
      const redirect = sessionStorage.getItem('gconfeitaria:redirect')
      if (redirect && redirect.startsWith('/') && !redirect.startsWith('//')) {
        sessionStorage.removeItem('gconfeitaria:redirect')
        history.replaceState(null, '', redirect)
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
